[project]
name = "nanomirrors"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.11.4",
    "geomloss>=0.3.1",
    "mygene>=3.2.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nanomirrors*"]
